/* HEADER */

  background: rgba(0,0,0,0.7);
  text-align: center;
  padding: 20px;
}

header img {
  width: 100px;
}

h1 { margin: 5px; }

/* BUTTON */
.button {
  background: gold;
  color: black;
  padding: 10px 20px;
  text-decoration: none;
  font-weight: bold;
  border-radius: 5px;
}

/* SLIDER */
.slider {
  overflow: hidden;
}

.slides {
  display: flex;
  animation: slide 20s infinite;
}

.slides img {
  width: 100%;
}

@keyframes slide {
  0% {margin-left: 0;}
  20% {margin-left: 0;}
  25% {margin-left: -100%;}
  45% {margin-left: -100%;}
  50% {margin-left: -200%;}
  70% {margin-left: -200%;}
  75% {margin-left: -300%;}
  95% {margin-left: -300%;}
  100% {margin-left: -400%;}
}

/* SECTION */
.section {
  background: rgba(0,0,0,0.6);
  margin: 15px;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
  animation: fadeIn 1s;
}

@keyframes fadeIn {
  from {opacity:0; transform: translateY(30px);}
  to {opacity:1; transform: translateY(0);}
}

/* GALLERY */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
  gap: 10px;
}

.gallery img {
  width: 100%;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}

.gallery img:hover {
  transform: scale(1.05);
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 999;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
}

.modal img {
  margin: auto;
  display: block;
  max-width: 90%;
  max-height: 80%;
  margin-top: 5%;
}

.modal span {
  position: absolute;
  top: 20px;
  right: 40px;
  font-size: 40px;
  cursor: pointer;
}

/* FLOAT BUTTONS */
.whatsapp-btn, .call-btn {

  color: white;
  font-size: 20px;

.whatsapp-btn { right: 20px; background: green; }

/* INSTAGRAM QR */

  top: 30px;
  right: 30px;
  width: 90px;
  border-radius: 20px;
}

/* MOBILE */
@media(max-width:600px){
